name: Build Images

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Build channel, such as canary, beta, or stable. Leave empty to infer from app-version.
        type: string
        required: false
      app-version:
        description: App version to stamp into packages. Leave empty to generate a canary version from the current commit.
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.argc.top:5001
  IMAGE_REPOSITORY: jachin/affine

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      build-type: ${{ steps.meta.outputs.build-type }}
      app-version: ${{ steps.meta.outputs.app-version }}
      git-short-hash: ${{ steps.meta.outputs.git-short-hash }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          input_build_type=""
          input_app_version=""
          if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            input_build_type=$(node -e "const fs=require('fs'); const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')); process.stdout.write(event.inputs?.['build-type'] || '')")
            input_app_version=$(node -e "const fs=require('fs'); const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')); process.stdout.write(event.inputs?.['app-version'] || '')")
          fi

          git_short_hash=$(git rev-parse --short HEAD)
          app_version="$input_app_version"

          if [ -z "$app_version" ]; then
            exact_tag=$(git describe --tags --exact-match 2>/dev/null || true)
            if [ -n "$exact_tag" ]; then
              app_version="${exact_tag#v}"
            else
              app_version="$(date '+%Y.%-m.%-d')-canary.${git_short_hash}"
            fi
          fi

          build_type="$input_build_type"
          if [ -z "$build_type" ]; then
            if [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              build_type=stable
            elif [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              build_type=beta
            elif [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9a-f]+$ ]]; then
              build_type=canary
            else
              echo "Error: unsupported version string: $app_version" >&2
              exit 1
            fi
          fi

          echo "build-type=$build_type" >> "$GITHUB_OUTPUT"
          echo "app-version=$app_version" >> "$GITHUB_OUTPUT"
          echo "git-short-hash=$git_short_hash" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build @affine/web
    runs-on: ubuntu-latest
    needs:
      - prepare
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          corepack-install: true
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app-version }}
      - name: Build Core
        run: yarn affine @affine/web build
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD_TYPE: ${{ needs.prepare.outputs.build-type }}
          CAPTCHA_SITE_KEY: ${{ secrets.CAPTCHA_SITE_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: 'affine-web'
          SENTRY_RELEASE: ${{ needs.prepare.outputs.app-version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PERFSEE_TOKEN: ${{ secrets.PERFSEE_TOKEN }}
      - name: Upload web artifact
        uses: actions/upload-artifact@v3
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
          if-no-files-found: error

  build-admin:
    name: Build @affine/admin
    runs-on: ubuntu-latest
    needs:
      - prepare
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          corepack-install: true
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app-version }}
      - name: Build Admin
        run: yarn affine @affine/admin build
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD_TYPE: ${{ needs.prepare.outputs.build-type }}
          CAPTCHA_SITE_KEY: ${{ secrets.CAPTCHA_SITE_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: 'affine-admin'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PERFSEE_TOKEN: ${{ secrets.PERFSEE_TOKEN }}
      - name: Upload admin artifact
        uses: actions/upload-artifact@v3
        with:
          name: admin
          path: ./packages/frontend/admin/dist
          if-no-files-found: error

  build-mobile:
    name: Build @affine/mobile
    runs-on: ubuntu-latest
    needs:
      - prepare
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          corepack-install: true
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app-version }}
      - name: Build Mobile
        run: yarn affine @affine/mobile build
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD_TYPE: ${{ needs.prepare.outputs.build-type }}
          CAPTCHA_SITE_KEY: ${{ secrets.CAPTCHA_SITE_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: 'affine-mobile'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PERFSEE_TOKEN: ${{ secrets.PERFSEE_TOKEN }}
      - name: Upload mobile artifact
        uses: actions/upload-artifact@v3
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  build-server-native:
    name: Build Server native - ${{ matrix.targets.name }}
    runs-on: ubuntu-22.04
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        targets:
          - name: x86_64-unknown-linux-gnu
            file: server-native.x64.node
          - name: aarch64-unknown-linux-gnu
            file: server-native.arm64.node
          - name: armv7-unknown-linux-gnueabihf
            file: server-native.armv7.node

    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          corepack-install: true
          electron-install: false
          extra-flags: workspaces focus @affine/server-native
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app-version }}
      - name: Install Rust build dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(build-essential clang)
          if [[ "${{ matrix.targets.name }}" == "x86_64-unknown-linux-gnu" && "$(uname -m)" != "x86_64" ]]; then
            packages+=(gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libc6-dev-amd64-cross)
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          else
            apt-get update
            apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - name: Build Rust
        uses: ./.github/actions/build-rust
        env:
          AFFINE_PRO_PUBLIC_KEY: ${{ secrets.AFFINE_PRO_PUBLIC_KEY }}
          AFFINE_PRO_LICENSE_AES_KEY: ${{ secrets.AFFINE_PRO_LICENSE_AES_KEY }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: x86_64-linux-gnu-gcc
          CC_x86_64_unknown_linux_gnu: x86_64-linux-gnu-gcc -D_BSD_SOURCE
          CXX_x86_64_unknown_linux_gnu: x86_64-linux-gnu-g++ -D_BSD_SOURCE
        with:
          target: ${{ matrix.targets.name }}
          package: '@affine/server-native'
      - name: Rename ${{ matrix.targets.file }}
        run: |
          mv ./packages/backend/native/server-native.node ./packages/backend/native/${{ matrix.targets.file }}
      - name: Upload ${{ matrix.targets.file }}
        uses: actions/upload-artifact@v3
        with:
          name: server-native-${{ matrix.targets.file }}
          path: ./packages/backend/native/${{ matrix.targets.file }}
          if-no-files-found: error

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-server-native
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          corepack-install: true
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app-version }}
      - name: Download server-native.x64.node
        uses: actions/download-artifact@v3
        with:
          name: server-native-server-native.x64.node
          path: ./packages/backend/native
      - name: Download server-native.arm64.node
        uses: actions/download-artifact@v3
        with:
          name: server-native-server-native.arm64.node
          path: ./packages/backend/native
      - name: Download server-native.armv7.node
        uses: actions/download-artifact@v3
        with:
          name: server-native-server-native.armv7.node
          path: ./packages/backend/native
      - name: List server-native files
        run: ls -alh ./packages/backend/native
      - name: Build Server
        run: yarn workspace @affine/server build
      - name: Upload server dist
        uses: actions/upload-artifact@v3
        with:
          name: server-dist
          path: ./packages/backend/server/dist
          if-no-files-found: error

  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - prepare
      - build-server
      - build-web
      - build-mobile
      - build-admin
    steps:
      - uses: actions/checkout@v6
      - name: Download server dist
        uses: actions/download-artifact@v3
        with:
          name: server-dist
          path: ./packages/backend/server/dist
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          logout: false
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # setup node without cache configuration
      # Prisma cache is not compatible with docker build cache
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com
          scope: '@toeverything'
      - name: Enable Corepack
        run: corepack enable

      - name: Download web artifact
        uses: actions/download-artifact@v3
        with:
          name: web
          path: ./packages/frontend/apps/web/dist

      - name: Download mobile artifact
        uses: actions/download-artifact@v3
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist

      - name: Download admin artifact
        uses: actions/download-artifact@v3
        with:
          name: admin
          path: ./packages/frontend/admin/dist

      - name: Install Node.js dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64", "arm64", "arm"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Mv node_modules
        run: mv ./node_modules ./packages/backend/server

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app-version }}

      - name: Build backend Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: false
          file: .github/deployment/node/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ needs.prepare.outputs.build-type }}-${{ needs.prepare.outputs.git-short-hash }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ needs.prepare.outputs.build-type }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ needs.prepare.outputs.app-version }}
