name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Build channel, such as canary, beta, or stable. Leave empty to infer from app-version.
        type: string
        required: false
      app-version:
        description: App version to stamp into packages. Leave empty to infer from the current tag or commit.
        type: string
        required: false
      create-release:
        description: Create a Gitea release and upload macOS artifacts.
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

env:
  DEBUG: 'affine:*,napi:*'
  APP_NAME: affine
  MACOSX_DEPLOYMENT_TARGET: '12.0'

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      build-type: ${{ steps.meta.outputs.build-type }}
      app-version: ${{ steps.meta.outputs.app-version }}
      git-short-hash: ${{ steps.meta.outputs.git-short-hash }}
      create-release: ${{ steps.meta.outputs.create-release }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve desktop release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          read_input() {
            local key="$1"
            if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
              node -e "const fs=require('fs'); const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')); const value=event.inputs?.[process.argv[1]] ?? ''; process.stdout.write(String(value));" "$key"
            fi
          }

          truthy() {
            case "${1:-}" in
              true|True|TRUE|1|yes|Yes|YES|on|On|ON) echo true ;;
              false|False|FALSE|0|no|No|NO|off|Off|OFF) echo false ;;
              *) echo "$2" ;;
            esac
          }

          input_build_type="$(read_input build-type)"
          input_app_version="$(read_input app-version)"

          git_short_hash="$(git rev-parse --short HEAD)"
          app_version="$input_app_version"

          if [ -z "$app_version" ]; then
            exact_tag="$(git describe --tags --exact-match 2>/dev/null || true)"
            if [ -n "$exact_tag" ]; then
              app_version="${exact_tag#v}"
            else
              app_version="$(date '+%Y.%-m.%-d')-canary.${git_short_hash}"
            fi
          fi

          build_type="$input_build_type"
          if [ -z "$build_type" ]; then
            if [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              build_type=stable
            elif [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              build_type=beta
            elif [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9a-f]+$ ]]; then
              build_type=canary
            else
              echo "Error: unsupported version string: $app_version" >&2
              exit 1
            fi
          fi

          create_release="$(truthy "$(read_input create-release)" true)"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            create_release=true
          fi

          {
            echo "build-type=$build_type"
            echo "app-version=$app_version"
            echo "git-short-hash=$git_short_hash"
            echo "create-release=$create_release"
          } >> "$GITHUB_OUTPUT"

  before-make:
    name: Generate desktop web assets
    runs-on: ubuntu-latest
    needs:
      - prepare
    env:
      BUILD_TYPE: ${{ needs.prepare.outputs.build-type }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.app-version }}
      MACOSX_DEPLOYMENT_TARGET: '11.6'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          corepack-install: true
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app-version }}
      - name: Setup @sentry/cli
        run: npm install -g @sentry/cli --unsafe-perm
      - name: generate-assets
        run: yarn affine @affine/electron generate-assets
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: affine
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ needs.prepare.outputs.app-version }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.app-version }}
      - name: Upload web artifact
        uses: actions/upload-artifact@v3
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static

  make-distribution-macos:
    name: Make macOS ${{ matrix.spec.arch }}
    needs:
      - prepare
      - before-make
    runs-on: ${{ matrix.spec.runner }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          - runner: macos-latest
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
          - runner: macos-latest
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
    env:
      BUILD_TYPE: ${{ needs.prepare.outputs.build-type }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.app-version }}
      SKIP_GENERATE_ASSETS: 1
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: affine
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_RELEASE: ${{ needs.prepare.outputs.app-version }}
    steps:
      - name: Ensure Node.js is available for actions
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/opt/homebrew/bin:/usr/local/bin:/opt/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          {
            echo "/opt/homebrew/bin"
            echo "/usr/local/bin"
            echo "/opt/local/bin"
            echo "/usr/bin"
            echo "/bin"
            echo "/usr/sbin"
            echo "/sbin"
          } >> "$GITHUB_PATH"

          if ! command -v node >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then
              brew install node
              echo "$(brew --prefix node)/bin" >> "$GITHUB_PATH"
            else
              node_version="22.13.1"
              case "$(uname -s)-$(uname -m)" in
                Darwin-arm64) node_platform="darwin-arm64" ;;
                Darwin-x86_64) node_platform="darwin-x64" ;;
                Linux-aarch64 | Linux-arm64) node_platform="linux-arm64" ;;
                Linux-x86_64) node_platform="linux-x64" ;;
                *)
                  echo "Unsupported platform for automatic Node.js bootstrap: $(uname -s)-$(uname -m)" >&2
                  exit 1
                  ;;
              esac

              node_dir="${RUNNER_TEMP:-/tmp}/node-v${node_version}-${node_platform}"
              mkdir -p "$node_dir"
              curl -fsSL "https://nodejs.org/dist/v${node_version}/node-v${node_version}-${node_platform}.tar.gz" |
                tar -xz -C "$node_dir" --strip-components=1
              echo "$node_dir/bin" >> "$GITHUB_PATH"
              export PATH="$node_dir/bin:$PATH"
            fi
          fi

          node --version
      - uses: actions/checkout@v6
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app-version }}
      - name: Setup Node.js
        timeout-minutes: 10
        uses: ./.github/actions/setup-node
        with:
          corepack-install: true
          extra-flags: workspaces focus @affine/electron @affine/monorepo @affine/nbstore @toeverything/infra
          hard-link-nm: false
          nmHoistingLimits: workspaces
      - name: Build AFFiNE native
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.spec.target }}
          package: '@affine/native'
      - name: Download desktop web
        uses: actions/download-artifact@v3
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static
      - name: Build Desktop Layers
        run: yarn affine @affine/electron build
      - name: Signing By Apple Developer ID
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
      - name: Remove nbstore node_modules
        shell: bash
        run: |
          cargo clean
          rm -rf packages/frontend/apps/electron/node_modules/@affine/nbstore/node_modules/@blocksuite
          rm -rf packages/frontend/apps/electron/node_modules/@affine/native/node_modules
      - name: make
        run: yarn affine @affine/electron make --platform=${{ matrix.spec.platform }} --arch=${{ matrix.spec.arch }}
        env:
          SKIP_WEB_BUILD: 1
          HOIST_NODE_MODULES: 1
          NODE_OPTIONS: --max-old-space-size=14384
      - name: signing DMG
        run: |
          codesign --force --sign "Developer ID Application: TOEVERYTHING PTE. LTD." packages/frontend/apps/electron/out/${{ env.BUILD_TYPE }}/make/AFFiNE.dmg
      - name: Save artifacts
        run: |
          mkdir -p builds
          mv packages/frontend/apps/electron/out/*/make/*.dmg ./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-macos-${{ matrix.spec.arch }}.dmg
          mv packages/frontend/apps/electron/out/*/make/zip/darwin/${{ matrix.spec.arch }}/*.zip ./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-macos-${{ matrix.spec.arch }}.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: affine-darwin-${{ matrix.spec.arch }}-builds
          path: builds

  release:
    name: Create Gitea release
    if: >-
      ${{
        always() &&
        needs.prepare.outputs.create-release == 'true' &&
        needs.make-distribution-macos.result == 'success'
      }}
    needs:
      - prepare
      - make-distribution-macos
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ needs.prepare.outputs.build-type }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.app-version }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Download Artifacts (macos-x64)
        uses: actions/download-artifact@v3
        with:
          name: affine-darwin-x64-builds
          path: ./release
      - name: Download Artifacts (macos-arm64)
        uses: actions/download-artifact@v3
        with:
          name: affine-darwin-arm64-builds
          path: ./release
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Copy Selfhost Release Files
        run: |
          mkdir -p ./release
          cp ./.docker/selfhost/compose.yml ./release/docker-compose.yml
          cp ./.docker/selfhost/.env.example ./release/.env.example
          cp ./.docker/selfhost/schema.json ./release/config.schema.json
      - name: Generate Release yml
        run: node ./scripts/generate-release-yml.mjs
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      - name: Create Gitea Release
        shell: bash
        run: |
          set -euo pipefail

          token="${RELEASE_TOKEN:-${GITEA_TOKEN:-${GITHUB_TOKEN:-}}}"
          if [ -z "$token" ]; then
            echo "Missing release token. Set RELEASE_TOKEN, GITEA_TOKEN, or GITHUB_TOKEN in Gitea secrets." >&2
            exit 1
          fi

          api_url="${GITHUB_API_URL:-}"
          if [ -z "$api_url" ]; then
            api_url="${GITHUB_SERVER_URL%/}/api/v1"
          fi

          draft=false
          prerelease=true
          if [ "$BUILD_TYPE" = stable ]; then
            draft=true
            prerelease=false
          fi

          release_json="$(DRAFT="$draft" PRERELEASE="$prerelease" node - <<'NODE'
          const payload = {
            tag_name: `v${process.env.RELEASE_VERSION}`,
            target_commitish: process.env.GITHUB_SHA,
            name: process.env.RELEASE_VERSION,
            body: '',
            draft: process.env.DRAFT === 'true',
            prerelease: process.env.PRERELEASE === 'true',
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          )"

          response="$(curl -fsS \
            -H "Authorization: token $token" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$release_json" \
            "$api_url/repos/$GITHUB_REPOSITORY/releases" || true)"

          release_id="$(printf '%s' "$response" | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => { try { const data = JSON.parse(s || '{}'); process.stdout.write(String(data.id || '')); } catch {} });")"

          if [ -z "$release_id" ]; then
            release_id="$(curl -fsS \
              -H "Authorization: token $token" \
              "$api_url/repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" \
              | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => { const data = JSON.parse(s); process.stdout.write(String(data.id)); });")"
          fi

          find ./release -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            echo "Uploading $name"
            curl -fsS \
              -H "Authorization: token $token" \
              -F "attachment=@$file" \
              "$api_url/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" >/dev/null
          done
